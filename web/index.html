<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>Horizon Pi</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="login-card">
    <img src="/icon.svg" alt="" class="login-icon">
    <h1>Horizon Pi</h1>
    <p class="muted">Panel für deine Horizon-Server</p>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="btn primary wide" type="submit">Anmelden</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <a href="#/" class="brand"><img src="/icon.svg" alt=""><span>Horizon Pi</span></a>
    <div id="top-chips" class="chips"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <a href="#/" data-nav="servers"><span class="ico">▦</span>Server</a>
    <a href="#/new" data-nav="new"><span class="ico">+</span>Neu</a>
    <a href="#/pi" data-nav="pi"><span class="ico">◉</span>Pi &amp; Horizon</a>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel" type="button">Abbrechen</button>
      <button class="btn danger" id="modal-ok" type="button">OK</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
