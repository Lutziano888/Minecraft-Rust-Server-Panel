[package]
name = "horizon-pi-panel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Web-Panel für Horizon-Server (Minecraft Java 26.3 in Rust) auf dem Raspberry Pi 5"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
argon2 = "0.5"
getrandom = "0.2"
libc = "0.2"
rpassword = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
